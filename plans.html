<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>划算 — 未来计划</title>
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    /* ========== plans.html 专用样式（BEM）========== */
    /* 参考 Capitrack goals 视图：进度条 + 优先级颜色编码 */

    /* 统计面板 */
    .plans__stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-md);
      margin-top: var(--space-xl);
      margin-bottom: var(--space-2xl);
    }
    .plans__stat {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-md);
    }
    .plans__stat-label {
      font-family: var(--font-sans-en);
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      margin-bottom: var(--space-xs);
    }
    .plans__stat-value {
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 600;
      color: var(--color-primary);
      line-height: 1.1;
    }
    .plans__stat-value--secondary {
      color: var(--color-secondary);
    }
    .plans__stat-value--muted {
      color: var(--color-text);
      font-size: 22px;
    }
    .plans__stat-sub {
      font-size: 12px;
      color: var(--color-text-muted);
      margin-top: 4px;
    }

    /* 工具栏 */
    .plans__toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-md);
      flex-wrap: wrap;
      gap: var(--space-sm);
    }
    .plans__sort-tabs {
      display: flex;
      gap: var(--space-xs);
      border-bottom: 1px solid var(--color-border);
    }
    .plans__sort-tab {
      padding: 8px 16px;
      font-size: 14px;
      color: var(--color-text-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      cursor: pointer;
      transition: all 200ms var(--ease-move);
      background: transparent;
      border-left: none;
      border-right: none;
      border-top: none;
      font-family: inherit;
    }
    .plans__sort-tab:hover { color: var(--color-text); }
    .plans__sort-tab.active {
      color: var(--color-primary);
      border-bottom-color: var(--color-primary);
      font-weight: 500;
    }

    /* 计划卡片 */
    .plans__list {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }
    .plans__card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-lg) var(--space-lg) var(--space-lg) var(--space-xl);
      position: relative;
      transition: transform 300ms var(--ease-enter), box-shadow 300ms var(--ease-enter);
      overflow: hidden;
    }
    .plans__card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(45, 74, 62, 0.06);
    }
    /* 优先级色条（左侧竖条） */
    .plans__card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--color-border);
    }
    .plans__card--priority-1::before { background: var(--color-primary); }
    .plans__card--priority-2::before { background: var(--color-secondary); }
    .plans__card--priority-3::before { background: var(--color-text-muted); }

    /* 已完成状态淡化 */
    .plans__card--completed {
      opacity: 0.65;
    }
    .plans__card--completed .plans__card-name {
      text-decoration: line-through;
    }

    .plans__card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--space-md);
      margin-bottom: var(--space-sm);
    }
    .plans__card-title-row {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }
    .plans__card-name {
      font-family: var(--font-serif-cn);
      font-size: 20px;
      font-weight: 500;
      color: var(--color-text);
    }
    .plans__priority-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    .plans__priority-badge--1 {
      background: rgba(45, 74, 62, 0.12);
      color: var(--color-primary);
    }
    .plans__priority-badge--2 {
      background: rgba(184, 147, 90, 0.18);
      color: var(--color-secondary);
    }
    .plans__priority-badge--3 {
      background: rgba(138, 138, 138, 0.15);
      color: var(--color-text-muted);
    }
    .plans__status-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    .plans__status-badge--active {
      background: rgba(45, 74, 62, 0.08);
      color: var(--color-primary);
    }
    .plans__status-badge--completed {
      background: rgba(45, 74, 62, 0.18);
      color: var(--color-primary);
      font-weight: 600;
    }
    .plans__status-badge--paused {
      background: rgba(184, 147, 90, 0.18);
      color: var(--color-secondary);
    }

    .plans__card-actions {
      display: flex;
      gap: var(--space-xs);
    }
    .plans__action-btn {
      width: 30px;
      height: 30px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-muted);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 200ms var(--ease-move);
      padding: 0;
      font-family: inherit;
    }
    .plans__action-btn:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    .plans__action-btn--danger:hover {
      border-color: var(--color-error);
      color: var(--color-error);
    }

    /* 预测设置条（v3.1：每笔独立计算） */
    .plans__forecast-settings {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-md);
      margin-top: var(--space-md);
      padding: var(--space-sm) var(--space-md);
      background: rgba(184, 147, 90, 0.06);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      flex-wrap: wrap;
    }
    .plans__forecast-field {
      display: flex;
      align-items: baseline;
      gap: var(--space-xs);
      flex-wrap: wrap;
    }
    .plans__forecast-label {
      font-family: var(--font-sans-en);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text-muted);
    }
    .plans__forecast-value {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 600;
      color: var(--color-primary);
    }
    .plans__forecast-hint {
      font-size: 11px;
      color: var(--color-text-muted);
    }
    .plans__forecast-select {
      padding: 6px 10px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 13px;
      background: var(--color-surface);
      color: var(--color-text);
      outline: none;
      cursor: pointer;
    }
    .plans__forecast-select:focus {
      border-color: var(--color-primary);
    }

    .plans__card-body {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: var(--space-md);
      margin-top: var(--space-sm);
    }
    @media (max-width: 768px) {
      .plans__card-body {
        grid-template-columns: 1fr 1fr;
      }
    }
    .plans__card-field {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .plans__field-label {
      font-family: var(--font-sans-en);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text-muted);
    }
    .plans__field-value {
      font-family: var(--font-mono);
      font-size: 15px;
      color: var(--color-text);
      font-weight: 500;
    }
    .plans__field-value--primary {
      color: var(--color-primary);
    }
    .plans__field-value--warning {
      color: var(--color-error);
    }
    .plans__field-value--muted {
      color: var(--color-text-muted);
    }

    .plans__card-note {
      margin-top: var(--space-sm);
      padding-top: var(--space-sm);
      border-top: 1px dashed var(--color-border);
      font-size: 13px;
      color: var(--color-text-muted);
      font-style: italic;
    }

    /* 空状态 */
    .plans__empty {
      text-align: center;
      padding: var(--space-3xl) var(--space-md);
      color: var(--color-text-muted);
    }
    .plans__empty-title {
      font-family: var(--font-serif-cn);
      font-size: 22px;
      margin-bottom: var(--space-sm);
      color: var(--color-text);
    }
    .plans__empty-desc {
      font-size: 14px;
      margin-bottom: var(--space-lg);
    }

    /* 模态框 */
    .plans__modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(26, 26, 26, 0.55);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: var(--space-md);
    }
    .plans__modal-overlay.show {
      display: flex;
    }
    .plans__modal {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.25);
    }
    .plans__modal-title {
      font-family: var(--font-serif-cn);
      font-size: 24px;
      font-weight: 500;
      margin-bottom: var(--space-lg);
      color: var(--color-text);
    }
    .plans__modal-close {
      float: right;
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      font-size: 22px;
      color: var(--color-text-muted);
      cursor: pointer;
      line-height: 1;
      margin-top: -8px;
      margin-right: -8px;
    }
    .plans__modal-close:hover { color: var(--color-text); }

    .plans__form-group { margin-bottom: var(--space-md); }
    .plans__form-label {
      display: block;
      font-size: 13px;
      color: var(--color-text-muted);
      margin-bottom: var(--space-xs);
    }
    .plans__form-input,
    .plans__form-select,
    .plans__form-textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: 15px;
      font-family: var(--font-mono);
      background: var(--color-surface);
      color: var(--color-text);
      outline: none;
      transition: border-color 200ms var(--ease-move);
    }
    .plans__form-input:focus,
    .plans__form-select:focus,
    .plans__form-textarea:focus {
      border-color: var(--color-primary);
    }
    .plans__form-textarea {
      font-family: var(--font-sans-cn);
      min-height: 70px;
      resize: vertical;
    }
    .plans__priority-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-xs);
    }
    .plans__priority-option {
      padding: 10px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      cursor: pointer;
      text-align: center;
      font-size: 14px;
      transition: all 200ms var(--ease-move);
      font-family: inherit;
      color: var(--color-text);
    }
    .plans__priority-option--selected[data-priority="1"] {
      border-color: var(--color-primary);
      background: rgba(45, 74, 62, 0.08);
      color: var(--color-primary);
      font-weight: 500;
    }
    .plans__priority-option--selected[data-priority="2"] {
      border-color: var(--color-secondary);
      background: rgba(184, 147, 90, 0.10);
      color: var(--color-secondary);
      font-weight: 500;
    }
    .plans__priority-option--selected[data-priority="3"] {
      border-color: var(--color-text-muted);
      background: rgba(138, 138, 138, 0.10);
      color: var(--color-text-muted);
      font-weight: 500;
    }

    .plans__modal-actions {
      display: flex;
      gap: var(--space-sm);
      margin-top: var(--space-lg);
      justify-content: flex-end;
    }

    /* 移动端 */
    @media (max-width: 768px) {
      .plans__stats {
        grid-template-columns: repeat(2, 1fr);
      }
      .plans__card-body {
        grid-template-columns: 1fr 1fr;
      }
      .plans__card-body .plans__card-field:last-child {
        grid-column: 1 / 3;
      }
      .plans__toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .plans__modal {
        padding: var(--space-lg);
      }
    }
  </style>
  <script>
    // CountUp 动画（与 calculator.html / cashflow.html 一致）
    function CountUp(target, endVal, options) {
      this.el = typeof target === 'string' ? document.getElementById(target) : target;
      this.endVal = endVal;
      this.options = Object.assign({
        startVal: 0, duration: 2, useEasing: true, separator: ',',
        decimal: '.', decimalPlaces: 0, prefix: '', suffix: ''
      }, options || {});
      this.duration = this.options.duration * 1000;
      this.startVal = this.options.startVal;
      this.frameVal = this.startVal;
      this.error = '';
      this.rAF = null;
      this.startTime = null;
      if (!this.el) this.error = '[CountUp] target is null';
    }
    CountUp.prototype.easeOutExpo = function(t, b, c, d) {
      return c * (1 - Math.pow(2, -10 * t / d)) + b;
    };
    CountUp.prototype.formatNumber = function(n) {
      var neg = n < 0 ? '-' : '';
      var fixed = Math.abs(n).toFixed(this.options.decimalPlaces);
      var parts = fixed.split('.');
      var intPart = parts[0];
      var decPart = parts.length > 1 ? this.options.decimal + parts[1] : '';
      if (this.options.separator) {
        intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, this.options.separator);
      }
      return neg + this.options.prefix + intPart + decPart + this.options.suffix;
    };
    CountUp.prototype.printValue = function(n) {
      if (this.el) this.el.innerHTML = this.formatNumber(n);
    };
    CountUp.prototype.count = function(timestamp) {
      if (!this.startTime) this.startTime = timestamp;
      var progress = timestamp - this.startTime;
      if (this.options.useEasing) {
        this.frameVal = this.easeOutExpo(progress, this.startVal, this.endVal - this.startVal, this.duration);
      } else {
        this.frameVal = this.startVal + (this.endVal - this.startVal) * (progress / this.duration);
      }
      if (this.endVal >= this.startVal ? this.frameVal > this.endVal : this.frameVal < this.endVal) {
        this.frameVal = this.endVal;
      }
      this.frameVal = Number(this.frameVal.toFixed(this.options.decimalPlaces));
      this.printValue(this.frameVal);
      if (progress < this.duration) {
        this.rAF = requestAnimationFrame(this.count.bind(this));
      } else {
        this.printValue(this.endVal);
        this.rAF = null;
        if (this.options.onCompleteCallback) this.options.onCompleteCallback();
      }
    };
    CountUp.prototype.start = function(callback) {
      if (this.error) return;
      if (callback) this.options.onCompleteCallback = callback;
      this.startTime = null;
      this.frameVal = this.startVal;
      this.rAF = requestAnimationFrame(this.count.bind(this));
    };
  </script>
</head>

  <!-- 导航（v3.2：现金流独立为 cashflow.html） -->
  <nav class="nav">
    <div class="container nav__inner">
      <a href="cashflow.html" class="nav__logo">划<span>算</span></a>
      <ul class="nav__menu">
        <li><a href="cashflow.html">现金流</a></li>

      </ul>

  <section class="section section--tight">
    <div class="container">
      <div class="eyebrow fade-up">PLANS</div>
      <h1 class="section-title fade-up">未来支出计划</h1>
      <p class="section-subtitle fade-up">为每笔目标排队，按优先级完成。所有数据本地保存。</p>

      <!-- 统计面板 -->
      <div class="plans__stats fade-up">
        <div class="plans__stat">
          <div class="plans__stat-label">总目标金额</div>
          <div class="plans__stat-value" id="statTotalAmount">0</div>
          <div class="plans__stat-sub">元</div>
        </div>
        <div class="plans__stat">
          <div class="plans__stat-label">进行中</div>
          <div class="plans__stat-value plans__stat-value--secondary" id="statActive">0</div>
          <div class="plans__stat-sub">个计划</div>
        </div>
        <div class="plans__stat">
          <div class="plans__stat-label">已完成</div>
          <div class="plans__stat-value plans__stat-value--muted" id="statCompleted">0</div>
          <div class="plans__stat-sub">个计划</div>
        </div>
        <div class="plans__stat">
          <div class="plans__stat-label">已暂停</div>
          <div class="plans__stat-value plans__stat-value--muted" id="statPaused">0</div>
          <div class="plans__stat-sub">个计划</div>
        </div>
      </div>

      <!-- 预测设置（v3.1：每笔独立计算，月结余从现金流读取） -->
      <div class="plans__forecast-settings fade-up">
        <div class="plans__forecast-field">
          <span class="plans__forecast-label">月结余</span>
          <span class="plans__forecast-value" id="monthlyBalanceDisplay">—</span>
          <span class="plans__forecast-hint" id="monthlyBalanceHint">从现金流读取</span>
        </div>
        <div class="plans__forecast-field">
          <span class="plans__forecast-label">年化收益率</span>
          <select id="rateSelect" class="plans__forecast-select">
            <option value="0">0% — 纯线性（默认）</option>
            <option value="3">3% — 货币基金/国债</option>
            <option value="5">5% — 稳健理财</option>
          </select>
        </div>
      </div>

      <!-- 工具栏 -->
      <div class="plans__toolbar fade-up">
        <div class="plans__sort-tabs">
          <button class="plans__sort-tab active" data-sort="priority">按优先级</button>
          <button class="plans__sort-tab" data-sort="deadline">按截止日期</button>
          <button class="plans__sort-tab" data-sort="createdAt">按创建时间</button>
        </div>
        <button class="btn btn--primary" id="addPlanBtn">+ 新建计划</button>
      </div>

      <!-- 计划列表 -->
      <div class="plans__list fade-up" id="plansList"></div>

      <!-- 空状态 -->
      <div class="plans__empty fade-up" id="plansEmpty" style="display:none;">
        <div class="plans__empty-title">还没有任何计划</div>
        <div class="plans__empty-desc">点击"新建计划"添加你的第一笔未来支出目标</div>
        <button class="btn btn--ghost" onclick="document.getElementById('addPlanBtn').click()">+ 新建计划</button>
      </div>
    </div>
  </section>

  <!-- 模态框：新建/编辑计划 -->
  <div class="plans__modal-overlay" id="planModal">
    <div class="plans__modal">
      <button class="plans__modal-close" id="modalCloseBtn">×</button>
      <h2 class="plans__modal-title" id="modalTitle">新建计划</h2>

      <div class="plans__form-group">
        <label class="plans__form-label">计划名称 *</label>
        <input type="text" class="plans__form-input" id="formName" placeholder="如：3年后买车" maxlength="40">
      </div>

      <div class="plans__form-group">
        <label class="plans__form-label">目标金额（元） *</label>
        <input type="number" class="plans__form-input" id="formAmount" placeholder="如：120000" min="0" step="1000">
      </div>

      <div class="plans__form-group">
        <label class="plans__form-label">优先级</label>
        <div class="plans__priority-options">
          <button type="button" class="plans__priority-option" data-priority="1">高</button>
          <button type="button" class="plans__priority-option" data-priority="2">中</button>
          <button type="button" class="plans__priority-option" data-priority="3">低</button>
        </div>
      </div>

      <div class="plans__form-group">
        <label class="plans__form-label">截止日期</label>
        <input type="month" class="plans__form-input" id="formDeadline">
      </div>

      <div class="plans__form-group">
        <label class="plans__form-label">状态</label>
        <select class="plans__form-select" id="formStatus">
          <option value="active">进行中</option>
          <option value="paused">已暂停</option>
          <option value="completed">已完成</option>
        </select>
      </div>

      <div class="plans__form-group">
        <label class="plans__form-label">备注（可选）</label>
        <textarea class="plans__form-textarea" id="formNote" placeholder="如：紧凑型轿车，含购置税" maxlength="200"></textarea>
      </div>

      <div class="plans__modal-actions">
        <button class="btn btn--ghost" id="modalCancelBtn">取消</button>
        <button class="btn btn--primary" id="modalSaveBtn">保存</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__brand">划算</div>
      <div class="footer__copy">© 2026 划算 · 财产健康，看得见</div>
    </div>
  </footer>

  <script>
    // ========== PlansApp 模块 ==========
    // 数据结构（task_plan.md 第三节功能2）：
    // Plan = { id, name, targetAmount, priority(1|2|3), deadline(YYYY-MM), status('active'|'completed'|'paused'), createdAt, note? }
    // 优先级颜色：高=主色、中=金色、低=灰色（task_plan.md 第三节功能2）
    // UI 参考 Capitrack 的目标进度条 + 优先级颜色编码

    function PlansApp() {
      this.STORAGE_KEY = 'huasuan_plans';
      this.CASHFLOW_KEY = 'huasuan_cashflow';
      this.state = this.loadState();
      this.countUpInstance = null;
      this.editingPlanId = null;
      this.selectedPriority = 2;  // 默认中优先级
      this.selectedRate = 0;      // 年化收益率百分比，默认 0%（v3.1）
      this.monthlyBalance = 0;    // 从 cashflow localStorage 读取（v3.1）
      this.init();
    }

    PlansApp.prototype.getDefaultPlans = function() {
      var now = new Date().toISOString();
      return [
        {
          id: this.genId(),
          name: '3年后买车',
          targetAmount: 120000,
          priority: 1,
          deadline: '2029-07',
          status: 'active',
          createdAt: now,
          note: '紧凑型轿车，含购置税'
        },
        {
          id: this.genId(),
          name: '5年后买房首付',
          targetAmount: 600000,
          priority: 1,
          deadline: '2031-07',
          status: 'active',
          createdAt: now,
          note: '一线城市小户型 30% 首付'
        },
        {
          id: this.genId(),
          name: '应急基金',
          targetAmount: 60000,
          priority: 2,
          deadline: '2027-01',
          status: 'active',
          createdAt: now,
          note: '6 个月生活费'
        },
        {
          id: this.genId(),
          name: '日本旅行',
          targetAmount: 20000,
          priority: 3,
          deadline: '2027-05',
          status: 'paused',
          createdAt: now,
          note: ''
        }
      ];
    };

    PlansApp.prototype.genId = function() {
      return 'plan_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    };

    PlansApp.prototype.loadState = function() {
      try {
        var raw = localStorage.getItem(this.STORAGE_KEY);
        if (!raw) return { plans: this.getDefaultPlans(), sortBy: 'priority' };
        var parsed = JSON.parse(raw);
        if (!parsed.plans) return { plans: this.getDefaultPlans(), sortBy: 'priority' };
        return { plans: parsed.plans, sortBy: parsed.sortBy || 'priority' };
      } catch (e) {
        console.warn('[Plans] 数据解析失败，使用默认值', e);
        return { plans: this.getDefaultPlans(), sortBy: 'priority' };
      }
    };

    PlansApp.prototype.saveState = function() {
      try {
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.state));
      } catch (e) {
        console.error('[Plans] 保存失败', e);
        alert('存储空间已满，请清理浏览器数据后重试');
      }
    };

    PlansApp.prototype.init = function() {
      this.bindEvents();
      this.updateSortTabs();
      this.render();
    };

    PlansApp.prototype.bindEvents = function() {
      var self = this;

      // 新建按钮
      document.getElementById('addPlanBtn').addEventListener('click', function() {
        self.openModal(null);
      });

      // 模态框关闭
      document.getElementById('modalCloseBtn').addEventListener('click', function() { self.closeModal(); });
      document.getElementById('modalCancelBtn').addEventListener('click', function() { self.closeModal(); });
      document.getElementById('planModal').addEventListener('click', function(e) {
        if (e.target.id === 'planModal') self.closeModal();
      });

      // 保存
      document.getElementById('modalSaveBtn').addEventListener('click', function() { self.savePlan(); });

      // 优先级选项
      document.querySelectorAll('.plans__priority-option').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          self.selectedPriority = parseInt(e.target.dataset.priority, 10);
          self.updatePrioritySelection();
        });
      });

      // 排序切换
      document.querySelectorAll('.plans__sort-tab').forEach(function(tab) {
        tab.addEventListener('click', function(e) {
          self.state.sortBy = e.target.dataset.sort;
          self.updateSortTabs();
          self.render();
          self.saveState();
        });
      });

      // 收益率切换（v3.1）
      document.getElementById('rateSelect').addEventListener('change', function(e) {
        self.selectedRate = parseFloat(e.target.value);
        self.render();
      });

      // ESC 关闭模态框
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') self.closeModal();
      });
    };

    PlansApp.prototype.updateSortTabs = function() {
      var self = this;
      document.querySelectorAll('.plans__sort-tab').forEach(function(tab) {
        tab.classList.toggle('active', tab.dataset.sort === self.state.sortBy);
      });
    };

    PlansApp.prototype.updatePrioritySelection = function() {
      document.querySelectorAll('.plans__priority-option').forEach(function(btn) {
        var p = parseInt(btn.dataset.priority, 10);
        btn.classList.toggle('plans__priority-option--selected', p === window.app.selectedPriority);
      });
    };

    // ========== 排序 ==========
    PlansApp.prototype.getSortedPlans = function() {
      var plans = this.state.plans.slice();
      var sortBy = this.state.sortBy;
      var priorityOrder = { 1: 0, 2: 1, 3: 2 };
      var statusOrder = { active: 0, paused: 1, completed: 2 };

      plans.sort(function(a, b) {
        // 已完成始终排最后（不论 sortBy）
        if (a.status === 'completed' && b.status !== 'completed') return 1;
        if (b.status === 'completed' && a.status !== 'completed') return -1;

        if (sortBy === 'priority') {
          if (priorityOrder[a.priority] !== priorityOrder[b.priority]) {
            return priorityOrder[a.priority] - priorityOrder[b.priority];
          }
          // 同优先级按截止日期升序
          return (a.deadline || '').localeCompare(b.deadline || '');
        } else if (sortBy === 'deadline') {
          if (!a.deadline) return 1;
          if (!b.deadline) return -1;
          return a.deadline.localeCompare(b.deadline);
        } else if (sortBy === 'createdAt') {
          return (b.createdAt || '').localeCompare(a.createdAt || '');
        }
        return 0;
      });

      return plans;
    };

    // ========== 渲染 ==========
    PlansApp.prototype.render = function() {
      this.monthlyBalance = this.readMonthlyBalance();  // 每次渲染重新读取现金流
      this.updateForecastSettings();
      this.renderStats();
      this.renderList();
    };

    // 更新预测设置条显示（v3.1）
    PlansApp.prototype.updateForecastSettings = function() {
      var balanceEl = document.getElementById('monthlyBalanceDisplay');
      var hintEl = document.getElementById('monthlyBalanceHint');
      if (this.monthlyBalance > 0) {
        balanceEl.textContent = '¥' + this.formatNum(this.monthlyBalance);
        hintEl.textContent = '从现金流读取';
        hintEl.style.color = 'var(--color-text-muted)';
      } else {
        balanceEl.textContent = '¥0';
        hintEl.textContent = '未配置，请前往现金流页面';
        hintEl.style.color = 'var(--color-error)';
      }
    };

    PlansApp.prototype.renderStats = function() {
      var plans = this.state.plans;
      var totalAmount = 0;
      var active = 0, completed = 0, paused = 0;

      plans.forEach(function(p) {
        if (p.status !== 'completed') {
          totalAmount += parseFloat(p.targetAmount) || 0;
        }
        if (p.status === 'active') active++;
        else if (p.status === 'completed') completed++;
        else if (p.status === 'paused') paused++;
      });

      document.getElementById('statActive').textContent = active;
      document.getElementById('statCompleted').textContent = completed;
      document.getElementById('statPaused').textContent = paused;

      // 总目标金额用 CountUp 动画
      var target = document.getElementById('statTotalAmount');
      var finalVal = Math.round(totalAmount);
      if (this.countUpInstance && !this.countUpInstance.error) {
        if (this.countUpInstance.rAF) {
          this.countUpInstance.endVal = finalVal;
        } else {
          this.countUpInstance.startVal = this.countUpInstance.frameVal;
          this.countUpInstance.endVal = finalVal;
          this.countUpInstance.startTime = null;
          this.countUpInstance.duration = 1500;
          this.countUpInstance.rAF = requestAnimationFrame(this.countUpInstance.count.bind(this.countUpInstance));
        }
      } else {
        this.countUpInstance = new CountUp(target, finalVal, {
          startVal: 0, duration: 1.5, useEasing: true, separator: ','
        });
        if (!this.countUpInstance.error) this.countUpInstance.start();
        else target.textContent = this.formatNum(finalVal);
      }
    };

    PlansApp.prototype.renderList = function() {
      var listEl = document.getElementById('plansList');
      var emptyEl = document.getElementById('plansEmpty');
      var self = this;

      if (this.state.plans.length === 0) {
        listEl.innerHTML = '';
        emptyEl.style.display = 'block';
        return;
      }
      emptyEl.style.display = 'none';

      var plans = this.getSortedPlans();
      listEl.innerHTML = '';

      plans.forEach(function(plan) {
        var card = self.renderPlanCard(plan);
        listEl.appendChild(card);
      });
    };

    PlansApp.prototype.renderPlanCard = function(plan) {
      var self = this;
      var card = document.createElement('div');
      var priorityClass = 'plans__card--priority-' + plan.priority;
      var statusClass = plan.status === 'completed' ? 'plans__card--completed' : '';
      card.className = 'plans__card ' + priorityClass + ' ' + statusClass;

      var priorityText = { 1: '高', 2: '中', 3: '低' }[plan.priority];
      var statusText = { active: '进行中', completed: '已完成', paused: '已暂停' }[plan.status];

      // 倒计时
      var deadlineInfo = this.formatDeadline(plan.deadline, plan.status);
      // 预计完成（v3.1：每笔独立计算）
      var forecastInfo = this.formatForecast(plan);

      card.innerHTML =
        '<div class="plans__card-header">' +
          '<div class="plans__card-title-row">' +
            '<span class="plans__card-name">' + this.escape(plan.name) + '</span>' +
            '<span class="plans__priority-badge plans__priority-badge--' + plan.priority + '">' + priorityText + '优先级</span>' +
            '<span class="plans__status-badge plans__status-badge--' + plan.status + '">' + statusText + '</span>' +
          '</div>' +
          '<div class="plans__card-actions">' +
            '<button class="plans__action-btn" data-action="toggle" data-id="' + plan.id + '" title="切换状态">↻</button>' +
            '<button class="plans__action-btn" data-action="edit" data-id="' + plan.id + '" title="编辑">✎</button>' +
            '<button class="plans__action-btn plans__action-btn--danger" data-action="delete" data-id="' + plan.id + '" title="删除">×</button>' +
          '</div>' +
        '</div>' +
        '<div class="plans__card-body">' +
          '<div class="plans__card-field">' +
            '<div class="plans__field-label">目标金额</div>' +
            '<div class="plans__field-value plans__field-value--primary">¥' + this.formatNum(plan.targetAmount) + '</div>' +
          '</div>' +
          '<div class="plans__card-field">' +
            '<div class="plans__field-label">截止日期</div>' +
            '<div class="plans__field-value">' + (plan.deadline || '未设置') + '</div>' +
          '</div>' +
          '<div class="plans__card-field">' +
            '<div class="plans__field-label">' + deadlineInfo.label + '</div>' +
            '<div class="plans__field-value ' + (deadlineInfo.warning ? 'plans__field-value--warning' : '') + '">' + deadlineInfo.text + '</div>' +
          '</div>' +
        '</div>' +
        (plan.note ? '<div class="plans__card-note">' + this.escape(plan.note) + '</div>' : '');

      // 绑定操作按钮
      card.querySelectorAll('.plans__action-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          var action = e.target.dataset.action;
          var id = e.target.dataset.id;
          if (action === 'edit') self.openModal(id);
          else if (action === 'delete') self.deletePlan(id);
          else if (action === 'toggle') self.toggleStatus(id);
        });
      });

      return card;
    };

    // ========== 截止日期格式化 ==========
    PlansApp.prototype.formatDeadline = function(deadline, status) {
      if (!deadline) return { label: '剩余时间', text: '未设置', warning: false };
      if (status === 'completed') return { label: '状态', text: '已达成', warning: false };

      var now = new Date();
      var nowYear = now.getFullYear();
      var nowMonth = now.getMonth() + 1;
      var parts = deadline.split('-');
      var dlYear = parseInt(parts[0], 10);
      var dlMonth = parseInt(parts[1], 10);

      var monthsDiff = (dlYear - nowYear) * 12 + (dlMonth - nowMonth);

      if (monthsDiff > 0) {
        var years = Math.floor(monthsDiff / 12);
        var months = monthsDiff % 12;
        var text = '';
        if (years > 0) text += years + ' 年 ';
        if (months > 0) text += months + ' 个月';
        return { label: '剩余时间', text: text.trim() + '后', warning: monthsDiff < 3 };
      } else if (monthsDiff === 0) {
        return { label: '剩余时间', text: '本月到期', warning: true };
      } else {
        var overdue = -monthsDiff;
        var oy = Math.floor(overdue / 12);
        var om = overdue % 12;
        var text = '';
        if (oy > 0) text += oy + ' 年 ';
        if (om > 0) text += om + ' 个月';
        return { label: '已逾期', text: text.trim(), warning: true };
      }
    };

    // ========== 预测计算（v3.1：每笔独立，非串行排队）==========
    // 从 cashflow localStorage 读取月结余
    PlansApp.prototype.readMonthlyBalance = function() {
      try {
        var raw = localStorage.getItem(this.CASHFLOW_KEY);
        if (!raw) return 0;
        var data = JSON.parse(raw);
        if (!data.incomes || !data.expenses) return 0;
        var income = data.incomes.reduce(function(s, it) { return s + (parseFloat(it.amount) || 0); }, 0);
        var expense = data.expenses.reduce(function(s, it) { return s + (parseFloat(it.amount) || 0); }, 0);
        return income - expense;
      } catch (e) {
        return 0;
      }
    };

    // 每笔独立计算（不考虑排队）：月结余÷目标金额
    // 0% 纯线性：月数 = ceil(金额 ÷ 月结余)
    // >0% 复利：月利率 = 年化÷12，每月累计 = 上月×(1+月利率) + 月结余
    // 参考 @toolsnap/compound-interest-calculator 的 withMonthlyContribution 公式
    PlansApp.prototype.calcPlanMonths = function(targetAmount, monthlyBalance, annualRatePercent) {
      if (monthlyBalance <= 0 || targetAmount <= 0) return Infinity;

      if (annualRatePercent === 0) {
        return Math.ceil(targetAmount / monthlyBalance);
      }

      var monthlyRate = annualRatePercent / 100 / 12;
      var accumulated = 0;
      var months = 0;
      var maxMonths = 1200; // 100 年上限
      while (accumulated < targetAmount && months < maxMonths) {
        accumulated = accumulated * (1 + monthlyRate) + monthlyBalance;
        months++;
      }
      return months >= maxMonths ? Infinity : months;
    };

    // 格式化月数为"X 年 Y 月"
    PlansApp.prototype.formatMonths = function(months) {
      if (!isFinite(months)) return '—';
      if (months <= 0) return '已达成';
      var years = Math.floor(months / 12);
      var remMonths = months % 12;
      if (years === 0) return remMonths + ' 个月';
      if (remMonths === 0) return years + ' 年';
      return years + ' 年 ' + remMonths + ' 月';
    };

    // 格式化单个计划的预计完成信息（v3.1）
    PlansApp.prototype.formatForecast = function(plan) {
      // 已完成
      if (plan.status === 'completed') {
        return { text: '已达成', valueClass: 'plans__field-value--primary' };
      }
      // 已暂停
      if (plan.status === 'paused') {
        return { text: '已暂停', valueClass: 'plans__field-value--muted' };
      }
      // 月结余为 0 或无数据
      if (this.monthlyBalance <= 0) {
        return { text: '请先填写现金流', valueClass: 'plans__field-value--warning' };
      }
      // 计算预计完成月数
      var target = parseFloat(plan.targetAmount) || 0;
      if (target <= 0) {
        return { text: '金额无效', valueClass: 'plans__field-value--warning' };
      }
      var months = this.calcPlanMonths(target, this.monthlyBalance, this.selectedRate);
      var text = '至少 ' + this.formatMonths(months);
      // 检查是否逾期（deadline 早于预测完成日期）
      var warning = false;
      if (plan.deadline && isFinite(months)) {
        var completeDate = new Date();
        completeDate.setMonth(completeDate.getMonth() + months);
        var deadlineDate = new Date(plan.deadline + '-01');
        if (deadlineDate < completeDate) {
          warning = true;
          text = '⚠ ' + text + '（已超期）';
        }
      }
      return { text: text, valueClass: warning ? 'plans__field-value--warning' : 'plans__field-value--primary' };
    };

    // ========== 模态框 ==========
    PlansApp.prototype.openModal = function(planId) {
      this.editingPlanId = planId;
      var modal = document.getElementById('planModal');

      if (planId) {
        // 编辑模式
        var plan = this.state.plans.find(function(p) { return p.id === planId; });
        if (!plan) return;
        document.getElementById('modalTitle').textContent = '编辑计划';
        document.getElementById('formName').value = plan.name;
        document.getElementById('formAmount').value = plan.targetAmount;
        document.getElementById('formDeadline').value = plan.deadline || '';
        document.getElementById('formStatus').value = plan.status;
        document.getElementById('formNote').value = plan.note || '';
        this.selectedPriority = plan.priority;
      } else {
        // 新建模式
        document.getElementById('modalTitle').textContent = '新建计划';
        document.getElementById('formName').value = '';
        document.getElementById('formAmount').value = '';
        document.getElementById('formDeadline').value = '';
        document.getElementById('formStatus').value = 'active';
        document.getElementById('formNote').value = '';
        this.selectedPriority = 2;
      }

      this.updatePrioritySelection();
      modal.classList.add('show');
      // 自动聚焦名称
      setTimeout(function() { document.getElementById('formName').focus(); }, 50);
    };

    PlansApp.prototype.closeModal = function() {
      document.getElementById('planModal').classList.remove('show');
      this.editingPlanId = null;
    };

    PlansApp.prototype.savePlan = function() {
      var name = document.getElementById('formName').value.trim();
      var amount = parseFloat(document.getElementById('formAmount').value);
      var deadline = document.getElementById('formDeadline').value;
      var status = document.getElementById('formStatus').value;
      var note = document.getElementById('formNote').value.trim();

      if (!name) {
        alert('请填写计划名称');
        document.getElementById('formName').focus();
        return;
      }
      if (!amount || amount <= 0 || isNaN(amount)) {
        alert('请填写有效的目标金额');
        document.getElementById('formAmount').focus();
        return;
      }

      if (this.editingPlanId) {
        // 编辑
        var plan = this.state.plans.find(function(p) { return p.id === this.editingPlanId; }, this);
        if (plan) {
          plan.name = name;
          plan.targetAmount = amount;
          plan.priority = this.selectedPriority;
          plan.deadline = deadline;
          plan.status = status;
          plan.note = note;
        }
      } else {
        // 新建
        this.state.plans.push({
          id: this.genId(),
          name: name,
          targetAmount: amount,
          priority: this.selectedPriority,
          deadline: deadline,
          status: status,
          createdAt: new Date().toISOString(),
          note: note
        });
      }

      this.saveState();
      this.closeModal();
      this.render();
    };

    PlansApp.prototype.deletePlan = function(id) {
      var plan = this.state.plans.find(function(p) { return p.id === id; });
      if (!plan) return;
      if (!confirm('确定删除"' + plan.name + '"？此操作不可恢复。')) return;
      this.state.plans = this.state.plans.filter(function(p) { return p.id !== id; });
      this.saveState();
      this.render();
    };

    PlansApp.prototype.toggleStatus = function(id) {
      var plan = this.state.plans.find(function(p) { return p.id === id; });
      if (!plan) return;
      // 状态循环：active → completed → paused → active
      var cycle = { active: 'completed', completed: 'paused', paused: 'active' };
      plan.status = cycle[plan.status] || 'active';
      this.saveState();
      this.render();
    };

    // ========== 工具方法 ==========
    PlansApp.prototype.formatNum = function(n) {
      if (typeof n !== 'number') n = parseFloat(n) || 0;
      return Math.round(n).toLocaleString('zh-CN');
    };

    PlansApp.prototype.escape = function(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    };

    // ========== 启动 ==========
    var app = null;
    document.addEventListener('DOMContentLoaded', function() {
      app = new PlansApp();
      window.app = app;  // 暴露给 updatePrioritySelection 使用

      // 滚动入场动画
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) entry.target.classList.add('visible');
        });
      }, { threshold: 0.1 });
      document.querySelectorAll('.fade-up').forEach(function(el) { observer.observe(el); });
    });
  </script>
</body>
