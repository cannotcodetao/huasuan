<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>划算 — 计算器</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script>
    // CountUp 动画（参考 CountUp.js v2.8.1 简化实现，MIT）
    function CountUp(target, endVal, options) {
      this.el = typeof target === 'string' ? document.getElementById(target) : target;
      this.endVal = endVal;
      this.options = Object.assign({
        startVal: 0, duration: 2, useEasing: true, separator: ',',
        decimal: '.', decimalPlaces: 0, prefix: '', suffix: ''
      }, options || {});
      this.duration = this.options.duration * 1000;
      this.startVal = this.options.startVal;
      this.frameVal = this.startVal;
      this.error = '';
      this.rAF = null;
      this.startTime = null;
      if (!this.el) this.error = '[CountUp] target is null';
    }
    CountUp.prototype.easeOutExpo = function(t, b, c, d) {
      return c * (1 - Math.pow(2, -10 * t / d)) + b;
    };
    CountUp.prototype.formatNumber = function(n) {
      var neg = n < 0 ? '-' : '';
      var fixed = Math.abs(n).toFixed(this.options.decimalPlaces);
      var parts = fixed.split('.');
      var intPart = parts[0];
      var decPart = parts.length > 1 ? this.options.decimal + parts[1] : '';
      if (this.options.separator) {
        intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, this.options.separator);
      }
      return neg + this.options.prefix + intPart + decPart + this.options.suffix;
    };
    CountUp.prototype.printValue = function(n) {
      if (this.el) this.el.innerHTML = this.formatNumber(n);
    };
    CountUp.prototype.count = function(timestamp) {
      if (!this.startTime) this.startTime = timestamp;
      var progress = timestamp - this.startTime;
      if (this.options.useEasing) {
        this.frameVal = this.easeOutExpo(progress, this.startVal, this.endVal - this.startVal, this.duration);
      } else {
        this.frameVal = this.startVal + (this.endVal - this.startVal) * (progress / this.duration);
      }
      if (this.endVal >= this.startVal ? this.frameVal > this.endVal : this.frameVal < this.endVal) {
        this.frameVal = this.endVal;
      }
      this.frameVal = Number(this.frameVal.toFixed(this.options.decimalPlaces));
      this.printValue(this.frameVal);
      if (progress < this.duration) {
        this.rAF = requestAnimationFrame(this.count.bind(this));
      } else {
        this.printValue(this.endVal);
        this.rAF = null;
        if (this.options.onCompleteCallback) this.options.onCompleteCallback();
      }
    };
    CountUp.prototype.start = function(callback) {
      if (this.error) return;
      if (callback) this.options.onCompleteCallback = callback;
      this.startTime = null;
      this.frameVal = this.startVal;
      this.rAF = requestAnimationFrame(this.count.bind(this));
    };
    CountUp.prototype.reset = function() {
      if (this.rAF) cancelAnimationFrame(this.rAF);
      this.startTime = null;
      this.frameVal = this.startVal;
      this.printValue(this.startVal);
    };
  </script>
</head>
<body>

  <!-- 导航（v3.4：现金流+未来计划合并为首页 index.html） -->
  <nav class="nav">
    <div class="container nav__inner">
      <a href="index.html" class="nav__logo">划<span>算</span></a>
      <ul class="nav__menu">
        <li><a href="index.html">首页</a></li>
        <li><a href="calculator.html" class="active">消费决策</a></li>
      </ul>
    </div>
  </nav>

  <section class="section section--tight">
    <div class="container">
      <div class="eyebrow fade-up">CALCULATOR</div>
      <h1 class="section-title fade-up">算清你的消费决策</h1>
      <p class="section-subtitle fade-up">选择类别，输入参数，实时计算盈亏平衡点。</p>

      <!-- 类别Tabs -->
      <div class="category-tabs fade-up" style="margin-top:var(--space-xl)">
        <div class="category-tab active" data-category="car">购车 vs 打车</div>
        <div class="category-tab" data-category="house">购房 vs 租房</div>
        <div class="category-tab" data-category="tableware">做饭 vs 外食</div>
      </div>

      <!-- 计算布局 v3.9：吸顶结果条 + 参数三列 + 全宽明细 -->
      <div class="calc-sticky fade-up">
        <div class="calc-sticky__main">
          <div class="result-eyebrow" id="resultLabel">请输入参数</div>
          <div class="result-number" id="resultNumber">0</div>
          <div class="result-unit" id="resultUnit"></div>
        </div>
        <div class="calc-sticky__sub" id="resultSubline"></div>
      </div>

      <div class="calc-cols fade-up" id="formSection"></div>

      <button class="btn btn--ghost fade-up" style="margin-top:var(--space-lg);width:100%;justify-content:center;" onclick="resetForm()">重置参数</button>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__brand">划算</div>
      <div class="footer__copy">© 2026 划算 · 决策即品味</div>
    </div>
  </footer>

  <script>
    // ========== 类别配置 ==========
    const categories = {
      car: {
        name: '购车',
        templateType: 'breakEven',
        defaults: {
          price: 120000, useYears: 10, annualInsurance: 4000,
          annualFuel: 8250, annualMaintenance: 2000, monthlyParking: 400,
          altUnitPrice: 2.5, loanRate: 0.05, hasLoan: false, loanRatio: 50,
        }
      },
      house: {
        name: '购房',
        templateType: 'breakEven',
        defaults: {
          price: 2000000, useYears: 50, altUnitPrice: 3000,
          annualInsurance: 3000, annualPropertyFee: 3600,
          loanRate: 0.04, hasLoan: false, loanRatio: 70,
        }
      },
      tableware: {
        name: '餐具',
        templateType: 'savings',
        defaults: { price: 30, margin: 70 }
      }
    };

    let currentCategory = 'car';
    let currentValues = {};
    let countUpInstance = null;
    let calcTimer = null;

    function init() {
      // 从URL参数获取类别
      const params = new URLSearchParams(location.search);
      const cat = params.get('cat');
      if (cat && categories[cat]) currentCategory = cat;
      currentValues = { ...categories[currentCategory].defaults };
      updateTabs();
      renderForm();
      calculate();
    }

    function updateTabs() {
      document.querySelectorAll('.category-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.category === currentCategory);
      });
    }

    function debouncedCalculate() {
      if (calcTimer) clearTimeout(calcTimer);
      calcTimer = setTimeout(calculate, 100);
    }

    // v3.9：参数三列语义分栏（购车 3 列 / 购房 3 列 / 餐具单列）
    function renderForm() {
      const form = document.getElementById('formSection');
      let html = '';

      if (currentCategory === 'car') {
        html += calcColumn('购置', 'ACQUISITION',
          createFormGroup('price', '购置价', '元', 'number') +
          createFormGroup('useYears', '使用年限', '年', 'number'));
        html += calcColumn('持有成本', 'OWNERSHIP',
          createFormGroup('annualInsurance', '年保险', '元', 'number') +
          createFormGroup('annualFuel', '年油费', '元', 'number') +
          createFormGroup('annualMaintenance', '年保养', '元', 'number') +
          createFormGroup('monthlyParking', '月停车', '元', 'number'));
        html += calcColumn('对比与贷款', 'VS & LOAN',
          createFormGroup('altUnitPrice', '打车单价', '元/公里', 'number') +
          loanGroupHtml());
      } else if (currentCategory === 'house') {
        const depreciation = currentValues.useYears > 0
          ? currentValues.price / currentValues.useYears : 0;
        html += calcColumn('购置', 'ACQUISITION',
          createFormGroup('price', '购置价', '元', 'number') +
          createFormGroup('useYears', '使用年限', '年', 'number') +
          calcSubGroup('持有成本', 'OWNERSHIP COST',
            readOnlyFormGroup('annualDepreciation', '年折旧', '元', depreciation) +
            createFormGroup('annualInsurance', '年保险', '元', 'number') +
            createFormGroup('annualPropertyFee', '年物业费', '元', 'number')));
        html += calcColumn('对比', 'RENTAL',
          createFormGroup('altUnitPrice', '月租金', '元/月', 'number'));
        html += calcColumn('贷款', 'LOAN', loanGroupHtml());
      } else {
        html += calcColumn('做饭 vs 外食', 'COOK VS EAT-OUT',
          createFormGroup('price', '每天用餐成本(做饭)', '元/天', 'number') +
          marginGroupHtml());
      }
      form.innerHTML = html;
    }

    function calcColumn(title, eyebrow, inner) {
      return `
        <div class="calc-col">
          <div class="calc-col__head"><h3>${title}</h3><span>${eyebrow}</span></div>
          ${inner}
        </div>
      `;
    }

    // 列内子分组（用于"持有成本"这类语义小标题，视觉层级比列头低一级）
    function calcSubGroup(title, eyebrow, inner) {
      return `
        <div class="calc-sub">
          <div class="calc-sub__head"><h4>${title}</h4><span>${eyebrow}</span></div>
          ${inner}
        </div>
      `;
    }

    // 只读展示字段（用于派生项：如年折旧，随价格/年限联动而不可直接编辑）
    function readOnlyFormGroup(key, label, unit, value) {
      return `
        <div class="form-group form-group--readonly">
          <div class="form-label">
            <span>${label}</span>
            <span class="value" id="${key}Label">${formatNumber(value)}</span>
          </div>
          <input type="text" class="form-input" id="${key}Input" value="${formatNumber(value)}" readonly tabindex="-1">
          <div class="form-hint">${unit} · 派生值 = 购置价 ÷ 使用年限</div>
        </div>
      `;
    }

    // 贷款组：切换按钮 + 比例/利率输入框（关闭时禁用置灰，布局不跳动）
    function loanGroupHtml() {
      const on = currentValues.hasLoan;
      return `
        <div class="form-group">
          <div class="form-label">
            <span>是否贷款</span>
            <span class="value" id="loanToggleLabel">${on ? '是' : '否'}</span>
          </div>
          <button type="button" class="loan-toggle${on ? ' loan-toggle--on' : ''}" id="loanToggle"
            role="switch" aria-checked="${on}" onclick="toggleLoan()">
            <span class="loan-toggle__track"><span class="loan-toggle__thumb"></span></span>
            <span class="loan-toggle__text">${on ? '开' : '关'}</span>
          </button>
        </div>
        <div class="form-group${on ? '' : ' form-group--off'}" id="loanRatioGroup">
          <div class="form-label">
            <span>贷款比例</span>
            <span class="value" id="loanRatioLabel">${currentValues.loanRatio}%</span>
          </div>
          <input type="number" class="form-input" id="loanRatioInput" value="${currentValues.loanRatio}"
            min="0" max="100" step="5" oninput="updateLoanRatio(this.value)"${on ? '' : ' disabled'}>
          <div class="form-hint">占购置价的 %（0–100）</div>
        </div>
        <div class="form-group${on ? '' : ' form-group--off'}" id="loanRateGroup">
          <div class="form-label">
            <span>年利率</span>
            <span class="value" id="loanRateLabel">${(currentValues.loanRate * 100).toFixed(1)}%</span>
          </div>
          <input type="number" class="form-input" id="loanRateInput" value="${(currentValues.loanRate * 100).toFixed(1)}"
            min="0" max="10" step="0.1" oninput="updateLoanRate(this.value)"${on ? '' : ' disabled'}>
          <div class="form-hint">贷款年利率 %（0–10）</div>
        </div>
      `;
    }

    function marginGroupHtml() {
      return `
        <div class="form-group">
          <div class="form-label">
            <span>外食毛利率</span>
            <span class="value" id="marginLabel">${currentValues.margin}%</span>
          </div>
          <input type="range" class="form-slider" min="60" max="80" step="1"
            value="${currentValues.margin}"
            oninput="updateValue('margin', this.value)">
          <div class="form-hint">毛利率60%-80%，默认70%（餐饮行业平均）</div>
        </div>
      `;
    }

    function createFormGroup(key, label, unit, type) {
      const value = currentValues[key];
      return `
        <div class="form-group">
          <div class="form-label">
            <span>${label}</span>
            <span class="value" id="${key}Label">${formatNumber(value)}</span>
          </div>
          <input type="${type}" class="form-input" value="${value}"
            oninput="updateValue('${key}', this.value)">
          <div class="form-hint">${unit}</div>
        </div>
      `;
    }

    function updateValue(key, value) {
      currentValues[key] = parseFloat(value) || 0;
      const label = document.getElementById(key + 'Label');
      if (label) {
        if (key === 'margin') {
          label.textContent = value + '%';
        } else {
          label.textContent = formatNumber(currentValues[key]);
        }
      }
      debouncedCalculate();
    }

    function updateLoanRatio(value) {
      let v = parseFloat(value);
      if (isNaN(v)) v = 0;
      v = Math.min(100, Math.max(0, v));
      currentValues.loanRatio = v;
      const label = document.getElementById('loanRatioLabel');
      if (label) label.textContent = v + '%';
      debouncedCalculate();
    }

    function updateLoanRate(value) {
      let v = parseFloat(value);
      if (isNaN(v)) v = 0;
      v = Math.min(10, Math.max(0, v));
      currentValues.loanRate = v / 100;
      const label = document.getElementById('loanRateLabel');
      if (label) label.textContent = v.toFixed(1) + '%';
      debouncedCalculate();
    }

    function toggleLoan() {
      currentValues.hasLoan = !currentValues.hasLoan;
      syncLoanUI();
      debouncedCalculate();
    }

    function syncLoanUI() {
      const on = currentValues.hasLoan;
      const btn = document.getElementById('loanToggle');
      if (btn) {
        btn.classList.toggle('loan-toggle--on', on);
        btn.setAttribute('aria-checked', on ? 'true' : 'false');
        const text = btn.querySelector('.loan-toggle__text');
        if (text) text.textContent = on ? '开' : '关';
      }
      const toggleLabel = document.getElementById('loanToggleLabel');
      if (toggleLabel) toggleLabel.textContent = on ? '是' : '否';
      ['loanRatioInput', 'loanRateInput'].forEach(function(id) {
        const el = document.getElementById(id);
        if (el) el.disabled = !on;
      });
      ['loanRatioGroup', 'loanRateGroup'].forEach(function(id) {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('form-group--off', !on);
      });
    }

    // 具象化类比常量（数据来源：国家测绘局 / 中国地理数据）
    const EARTH_EQUATOR_KM = 40075;       // 地球赤道周长（公里）
    const CHINA_NORTH_SOUTH_KM = 5500;      // 中国南北跨度（公里，漠河-曾母暗沙）
    const CHINA_EAST_WEST_KM = 5200;        // 中国东西跨度（公里，帕米尔-乌苏里江）

    function calculate() {
      const cat = categories[currentCategory];
      let result = 0, label = '', unit = '', decimals = 0;
      let subline = '';

      if (cat.templateType === 'breakEven') {
        if (currentCategory === 'car') {
          const depreciation = currentValues.price / currentValues.useYears;
          const loanInterest = currentValues.hasLoan
            ? currentValues.price * (currentValues.loanRatio / 100) * currentValues.loanRate : 0;
          const annualCost = depreciation + currentValues.annualInsurance
            + currentValues.annualFuel + currentValues.annualMaintenance
            + currentValues.monthlyParking * 12 + loanInterest;
          result = currentValues.altUnitPrice > 0 ? annualCost / currentValues.altUnitPrice : 0;
          label = '相当于每年打车';
          unit = '公里';

          // 具象化类比：绕地球几圈 + 纵穿中国几次
          let analogy = '';
          if (result > 0) {
            const earthLoops = result / EARTH_EQUATOR_KM;
            const cnNorthSouth = result / CHINA_NORTH_SOUTH_KM;
            analogy = `约绕地球赤道 <strong>${earthLoops.toFixed(2)}</strong> 圈 · ` +
              `纵穿中国 <strong>${cnNorthSouth.toFixed(1)}</strong> 次`;
          }

          subline = `年总成本 <strong>¥${fmt(annualCost)}</strong>` +
            (currentValues.hasLoan ? ` · 贷款利息 <strong>¥${fmt(loanInterest)}</strong>` : '') +
            (analogy ? ` · ${analogy}` : '');

        } else if (currentCategory === 'house') {
          const depreciation = currentValues.useYears > 0
            ? currentValues.price / currentValues.useYears : 0;
          const ownershipAnnual = depreciation
            + currentValues.annualInsurance
            + currentValues.annualPropertyFee;
          const loanInterestAnnual = currentValues.hasLoan
            ? currentValues.price * (currentValues.loanRatio / 100) * currentValues.loanRate : 0;
          const totalAnnualCost = ownershipAnnual + loanInterestAnnual;
          const annualRent = currentValues.altUnitPrice * 12;
          // 总成本口径：累计持有成本 + 累计贷款利息 + 购置价，等效于多少年租金现金流
          const beYears = annualRent > 0
            ? (currentValues.price + totalAnnualCost * currentValues.useYears) / annualRent : 0;
          const beMonths = beYears * 12;
          result = beYears;
          label = `相当于 ${fmt(currentValues.altUnitPrice)} 元/月房租，住`;
          unit = '年';
          decimals = 1;
          subline = `购房总价 <strong>¥${fmt(currentValues.price)}</strong> · ` +
            `年持有+利息 <strong>¥${fmt(totalAnnualCost)}</strong> · ` +
            `盈亏平衡 <strong>${Math.round(beMonths)}</strong> 个月`;

          // 同步"年折旧"的派生字段显示（价格/年限变动时实时更新）
          const depLabel = document.getElementById('annualDepreciationLabel');
          if (depLabel) depLabel.textContent = formatNumber(depreciation);
          const depInput = document.getElementById('annualDepreciationInput');
          if (depInput) depInput.value = formatNumber(depreciation);
        }
      } else if (cat.templateType === 'savings') {
        const margin = currentValues.margin / 100;
        const eatOutDailyCost = currentValues.price / (1 - margin);
        const dailySavings = eatOutDailyCost - currentValues.price;
        const annualSavings = dailySavings * 365;
        result = annualSavings;
        label = '相当于每年省下';
        unit = '元';
        subline = `日节省 <strong>¥${fmt(dailySavings)}</strong> · 年节省 <strong>¥${fmt(annualSavings)}</strong>`;
      }
      displayResult(result, label, unit, decimals, subline);
    }

    function displayResult(value, label, unit, decimals, subline) {
      document.getElementById('resultLabel').textContent = label;
      document.getElementById('resultUnit').textContent = unit;
      document.getElementById('resultSubline').innerHTML = subline;

      const target = document.getElementById('resultNumber');
      const dec = decimals || 0;
      const finalVal = dec > 0 ? Number(value.toFixed(dec)) : Math.round(value);

      if (countUpInstance && !countUpInstance.error) {
        if (countUpInstance.rAF) {
          countUpInstance.endVal = finalVal;
        } else {
          countUpInstance.startVal = countUpInstance.frameVal;
          countUpInstance.endVal = finalVal;
          countUpInstance.startTime = null;
          countUpInstance.duration = 1500;
          countUpInstance.rAF = requestAnimationFrame(countUpInstance.count.bind(countUpInstance));
        }
      } else {
        countUpInstance = new CountUp(target, finalVal, {
          startVal: 0, duration: 1.5, useEasing: true, separator: ',', decimalPlaces: dec
        });
        if (!countUpInstance.error) countUpInstance.start();
        else target.textContent = formatNumber(finalVal);
      }
    }

    function switchCategory(cat) {
      currentCategory = cat;
      currentValues = { ...categories[cat].defaults };
      countUpInstance = null;  // 切换类别时重置，避免 decimalPlaces 残留
      updateTabs();
      renderForm();
      calculate();
    }

    function resetForm() {
      currentValues = { ...categories[currentCategory].defaults };
      renderForm();
      calculate();
    }

    function formatNumber(n) {
      if (typeof n !== 'number') n = parseFloat(n) || 0;
      return Math.round(n).toLocaleString('zh-CN');
    }
    function fmt(n) {
      if (typeof n !== 'number') n = parseFloat(n) || 0;
      return Math.round(n).toLocaleString('zh-CN');
    }

    // 事件绑定
    document.querySelectorAll('.category-tab').forEach(tab => {
      tab.addEventListener('click', () => switchCategory(tab.dataset.category));
    });

    // v3.9：吸顶条 top 动态对齐 nav 实际高度（移动端 nav 换行会变高）
    function syncStickyTop() {
      const nav = document.querySelector('.nav');
      const bar = document.querySelector('.calc-sticky');
      if (nav && bar) bar.style.top = (nav.offsetHeight + 1) + 'px';
    }
    window.addEventListener('resize', syncStickyTop);
    syncStickyTop();

    // 滚动动画
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));

    init();
  </script>
</body>
</html>
